tests:
  - id: capital-france
    input: "What is the capital of France? Context: France is a country in Western Europe. Its capital is Paris, which is known for the Eiffel Tower."
    expected: "Paris"
    eval_mode: contains

  - id: python-creator
    input: "Who created Python? Context: Python is a programming language created by Guido van Rossum in 1991."
    expected: "Guido van Rossum"
    eval_mode: contains

  - id: no-context-answer
    input: "What is the speed of light? Context: Water boils at 100 degrees Celsius at sea level."
    expected: "I don't have enough information"
    eval_mode: contains

  - id: year-founded
    input: "When was OpenAI founded? Context: OpenAI is an AI research company founded in 2015 by Sam Altman, Elon Musk, and others."
    expected: "2015"
    eval_mode: contains

  - id: multi-fact
    input: "What are the two largest oceans? Context: The Pacific Ocean is the largest ocean, and the Atlantic Ocean is the second largest."
    expected: "Pacific"
    eval_mode: contains
